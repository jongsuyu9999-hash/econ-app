<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>오늘의 경제</title>
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="오늘의 경제" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>오늘의 경제</h1>
      <p id="stamp" class="muted">불러오는 중…</p>
    </div>
    <select id="archive" aria-label="지난 브리핑 보기"></select>
  </header>

  <main>
    <section id="ai" class="card ai" hidden>
      <h2 id="ai-headline"></h2>
      <ul id="ai-points"></ul>
      <div id="ai-watch-wrap">
        <h3>지켜볼 것</h3>
        <ul id="ai-watch"></ul>
      </div>
      <p class="muted small">AI가 아래 시세와 뉴스 제목을 바탕으로 쓴 요약이에요. 투자 판단의 근거로 쓰기 전에 원문을 확인하세요.</p>
    </section>

    <section id="markets"></section>

    <section class="card">
      <div class="tabs" role="tablist" id="news-tabs"></div>
      <ul id="news" class="news"></ul>
    </section>
  </main>

  <footer class="muted small">
    시세: Yahoo Finance (지연될 수 있음) · 뉴스: 각 언론사 RSS
  </footer>

  <script src="app.js" type="module"></script>
</body>
</html>
